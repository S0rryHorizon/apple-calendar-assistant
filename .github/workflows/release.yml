name: Build experimental release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to package, for example v1.0.0-experimental
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    # ReminderKit is a private framework available on the macOS 26 image.
    # This first automated artifact is Apple Silicon and intentionally marked
    # experimental until a Developer ID/notarization workflow is configured.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build package
        run: ./scripts/package-release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "${TAG}" dist/*.zip dist/*.sha256 \
            --verify-tag \
            --title "${TAG} (unsigned Apple Silicon experimental build)" \
            --prerelease \
            --notes $'This is an unsigned Apple Silicon experimental build.\n\nIt requires macOS 26 or later and uses the private ReminderKit framework for native Early Reminders. For the reproducible source installation, see docs/USER_GUIDE.md.'
