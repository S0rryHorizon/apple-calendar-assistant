name: Test

on:
  push:
  pull_request:

jobs:
  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c debug
      - name: Core self-test
        run: swift run CalendarBridgeSelfTest
      - name: Reliability scenarios
        run: swift run CalendarBridgeReliabilityTests
      - name: Synthetic service recovery scenarios
        run: swift run CalendarBridgeServiceTests
      - name: Controlled synthetic service demo
        run: swift run CalendarBridgeServiceTests --demo
      - name: Notification script with synthetic bridge
        run: python3 -m unittest Tests/notification_smoke_test.py

  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependencies
        run: python -m pip install -r Tests/requirements.txt
      - name: Parser tests
        run: python -m unittest Tests/parser_test.py
      - name: Installer tests
        run: python -m unittest Tests/installer_test.py
